name: Odds and application contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARP_CONTRACT_TEST_DB_URL: postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked --extra nn
      # Keep native LightGBM and PyTorch execution in separate processes.
      - run: >-
          uv run --no-sync pytest -q
          --ignore=tests/calculations/test_nn_transformer.py
          --ignore=tests/flows/test_nn_training_flow.py
          --ignore=tests/integrations/test_nn_model_store.py
      - run: >-
          uv run --no-sync pytest -q tests/calculations/test_nn_transformer.py
          tests/flows/test_nn_training_flow.py tests/integrations/test_nn_model_store.py
