sources:
  - name: published_manual
    description: >
      Manually refreshed published relations that should not be rebuilt in the default dbt workflow.
      Odds snapshot tables here are normalized outputs derived from heavy historical `n_jodds_*`
      sources and are the preferred source for training or analysis snapshots such as pre-race
      10-minute odds.
    schema: core
    tables:
      - name: fct_jodds_snapshot
        description: >
          Normalized single-horse odds snapshot table derived from the heavy historical
          `n_jodds_tanpuku` source and refreshed outside the default training and mart workflow.
          Use this as the source for learning and analysis snapshots such as pre-race 10-minute
          odds. Do not use final `n_odds` odds as pre-race training features.
        columns:
          - name: race_id
            description: ''
            config:
              meta: {}
              tags: []
          - name: happyo_time
            description: ''
            config:
              meta: {}
              tags: []
          - name: horse_number
            description: ''
            config:
              meta: {}
              tags: []
          - name: odds_tansho
            description: ''
            config:
              meta: {}
              tags: []
          - name: odds_fukusho_low
            description: ''
            config:
              meta: {}
              tags: []
          - name: odds_fukusho_high
            description: ''
            config:
              meta: {}
              tags: []
          - name: popularity
            description: ''
            config:
              meta: {}
              tags: []
          - name: hassotime
            description: ''
            config:
              meta: {}
              tags: []
      - name: fct_jodds_umaren_snapshot
        description: >
          Normalized umaren odds snapshot table derived from the heavy historical
          `n_jodds_umaren` source and refreshed outside the default training and mart workflow.
          Use this for reusable pre-race umaren odds snapshots instead of scanning raw
          historical `n_jodds_umaren` in ordinary DAGs.
        columns:
          - name: race_id
            description: ''
            config:
              meta: {}
              tags: []
          - name: happyo_time
            description: ''
            config:
              meta: {}
              tags: []
          - name: horse_number_1
            description: ''
            config:
              meta: {}
              tags: []
          - name: horse_number_2
            description: ''
            config:
              meta: {}
              tags: []
          - name: pair_key
            description: ''
            config:
              meta: {}
              tags: []
          - name: odds_umaren
            description: ''
            config:
              meta: {}
              tags: []
          - name: popularity
            description: ''
            config:
              meta: {}
              tags: []
          - name: hassotime
            description: ''
            config:
              meta: {}
              tags: []
  - name: raw
    description: >
      EveryDB2がJRA-VAN DataLabからpublic schemaへ取り込むraw source群。dbtでは
      直接加工せず、staging modelで型変換・キー生成・速報/蓄積の使い分けを行う。
      `n_`系は蓄積系テーブル群で、過去データ・セットアップデータ・今週データを含む
      履歴参照や学習/検証の基礎に使う。`s_`系は速報系テーブル群で、今週開催分と
      速報更新をrace-day用途で参照するための短期テーブル。EveryDB2の仕様上、
      `s_`系は15日以上前のデータが自動削除されるため、再現性が必要なsnapshotは
      downstreamで永続化すること。更新はdbtではなくEveryDB2の手動/自動更新で行われる。
      開催週の`S_`行は出走馬名表、オッズ、馬体重、払戻、成績確定などのタイミングで
      追加・上書きされるため、pre-race特徴量ではpost-race項目の混入に注意する。
      確定後オッズはレース後に確定する情報なので、開催前予測の特徴量に混ぜると
      leakageになる。
    schema: public
    tables:
      - name: n_uma
        description: >
          EveryDB2 `N_UMA`の競走馬マスタ。血統登録番号を軸に馬名、性別、血統、
          所属、馬主・生産者などの馬プロフィールを保持する蓄積系source。過去期間を
          またいだhorse dimensionや血統特徴量の基礎に使う。主にセットアップデータと
          蓄積情報の差分更新で保守され、速報用途で最新週だけを見たい場合でも
          `S_UMA`ではなくこの履歴マスタとの整合を確認する。
        columns:
          - name: recordspec
            description: ''
            config:
              meta: {}
              tags: []
