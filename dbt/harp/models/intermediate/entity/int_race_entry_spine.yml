version: 2

models:
  - name: int_race_entry_spine
    description: "Common race-entry spine at race_id, kettonum grain for training and inference pipelines."
    columns:
      - name: race_id
        description: "Race identifier."
        tests:
          - not_null
      - name: kettonum
        description: "Horse identifier."
        tests:
          - not_null
      - name: held_date
        description: "Race date."
      - name: horse_number
        description: "Horse number within the race."
      - name: gate_number
        description: "Gate/frame number."
      - name: ijyo_cd
        description: "Abnormal finish / scratch / exclusion code. Null for normal entries."
      - name: is_scratched_or_excluded
        description: "True when ijyo_cd is present."
      - name: has_result
        description: "True when a result row exists."
      - name: entry_status
        description: "Entry lifecycle status: declared, scratched, or resulted."
      - name: is_prediction_target
        description: "True for active entries without finalized results."
