version: 2

models:
  - name: int_race_day_odds_latest
    description: "Race-day latest odds table derived from int_race_day_odds_history by keeping one latest publication per race and horse."
    columns:
      - name: race_id
        description: "Race identifier for the target held date."
        tests:
          - not_null
      - name: horse_number
        description: "Horse number within the race."
        tests:
          - not_null
      - name: odds_snapshot_type
        description: "Odds snapshot timing. Always latest for the race-day table."
        tests:
          - not_null
      - name: snapshot_time_key
        description: "Numeric JRA publication time key selected from the latest history row."
      - name: snapshot_at
        description: "Latest JRA odds publication time from int_race_day_odds_history, stored as the source HHMM-style value."
      - name: odds_tansho
        description: "Latest win odds."
      - name: odds_fukusho_low
        description: "Latest place odds lower bound."
      - name: odds_fukusho_high
        description: "Latest place odds upper bound."
      - name: odds_fukusho_avg
        description: "Mean of latest place odds lower and upper bounds."
      - name: odds_fukusho_weighted_avg
        description: "Weighted latest place odds average: 0.7 * low + 0.3 * high."
      - name: popularity
        description: "Latest popularity rank when available."
      - name: odds_source
        description: "Intermediate odds history model used for the latest row."
      - name: updated_at
        description: "dbt model build timestamp."
