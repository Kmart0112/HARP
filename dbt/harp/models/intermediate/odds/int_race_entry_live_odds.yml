version: 2

models:
  - name: int_race_entry_live_odds
    description: "Compatibility view for race-day latest odds keyed by race and horse. The materialized latest table is int_race_day_odds_latest; this view exposes odds_snapshot_type for race-day overlay models."
    columns:
      - name: race_id
        description: "Race identifier."
        tests:
          - not_null
      - name: horse_number
        description: "Horse number within the race."
        tests:
          - not_null
      - name: odds_snapshot_type
        description: "Always latest for race-day inference."
        tests:
          - not_null
      - name: snapshot_at
        description: "Latest JRA odds publication time from int_race_day_odds_latest."
      - name: odds_tansho
        description: "Latest win odds."
      - name: odds_fukusho_low
        description: "Latest place odds lower bound."
      - name: odds_fukusho_high
        description: "Latest place odds upper bound."
      - name: odds_fukusho_avg
        description: "Mean of latest place odds lower and upper bounds."
      - name: odds_fukusho_weighted_avg
        description: "Weighted latest place odds average: 0.7 * low + 0.3 * high."
      - name: popularity
        description: "Latest popularity rank."
      - name: odds_source
        description: "Source relation used for latest odds."
      - name: updated_at
        description: "dbt model build timestamp."
