        description: "3-year sum of pos4_agari_synergy where ten3f_ntile=2."
        config:
          meta: {}
          tags: []
      - name: pace_ntile2_avg_pos4_agari_synergy
        description: "pace_ntile2_past_pos4_agari_synergy / pace_ntile2_past_starts (only when starts > 0)."
        config:
          meta: {}
          tags: []
      - name: pace_ntile2_place_rate
        description: "pace_ntile2_past_places / pace_ntile2_past_starts (only when starts > 0)."
