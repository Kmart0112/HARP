version: 2
models:
  - name: feat_horse_past_metrics
    description: "Integrated horse history feature table joining cluster, distance, surface, turn-direction, racecourse-distance, pace-bucket, and overall history features. Most windows use 3-year lookback with current day excluded. Raw definitions: https://everydb.iwinz.net/edb2_manual/."
    columns:
      - name: kettonum
        description: "Horse identifier."
        config:
          meta: {}
          tags: []
      - name: held_date
        description: "Race date used as feature reference date."
        config:
          meta: {}
          tags: []
      - name: same_cluster_past_starts
        description: "Past 3-year starts in same course_cluster (unweighted count)."
        config:
          meta: {}
          tags: []
      - name: same_cluster_first_start_flag
        description: "Flag = 1 when the horse has zero past 3-year starts in the same course_cluster as of held_date, else 0."
        config:
          meta: {}
          tags: []
      - name: same_cluster_past_places
        description: "Past 3-year places in same course_cluster (unweighted sum)."
        config:
          meta: {}
          tags: []
      - name: same_cluster_past_time_diffs
        description: "Past 3-year sum of time_diff in same course_cluster."
        config:
          meta: {}
          tags: []
      - name: same_cluster_past_pos4_agari_synergy
        description: "Past 3-year sum of pos4_agari_synergy in same course_cluster."
        config:
          meta: {}
          tags: []
      - name: same_cluster_avg_pos4_agari_synergy
        description: "Exponentially weighted average from int_horse_same_cluster_daily_cum: same_cluster_past_weighted_pos4_agari_synergy / same_cluster_past_weighted_starts (half-life 180 days)."
        config:
          meta: {}
          tags: []
      - name: same_distance_past_starts
        description: "Past 3-year starts at same distance_m."
        config:
          meta: {}
          tags: []
      - name: same_distance_past_places
        description: "Past 3-year places at same distance_m."
        config:
          meta: {}
          tags: []
      - name: same_distance_past_pos4_agari_synergy
        description: "Past 3-year sum of pos4_agari_synergy at same distance_m."
        config:
          meta: {}
          tags: []
      - name: same_distance_avg_pos4_agari_synergy
        description: "same_distance_past_pos4_agari_synergy / same_distance_past_starts (starts > 0)."
        config:
          meta: {}
          tags: []
      - name: same_surface_condition_past_starts
        description: "Past 3-year starts at same (surface, surface_condition_cd)."
        config:
          meta: {}
