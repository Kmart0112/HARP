version: 2
models:
  - name: m_race_entry_context
    description: "Race-entry level display and reporting context for joining human-readable attributes back to lightweight feature marts and prediction outputs."
    columns:
      - name: race_id
        description: "Race key built as YYYY + MMDD + JyoCD + Kaiji + Nichiji + RaceNum."
        tests:
          - not_null
      - name: kettonum
        description: "Horse identifier from raw n_uma_race.KettoNum."
        tests:
          - not_null
      - name: horse_number
        description: "Horse number within the race."
        tests:
          - not_null
      - name: horse_name
        description: "Human-readable horse name for reporting and prediction output."
      - name: sire_name
        description: "Human-readable sire name for reporting and diagnostics."
      - name: held_date
        description: "Race date."
        tests:
          - not_null
      - name: jyo_name
        description: "Human-readable racecourse name."
      - name: round
        description: "Race number within the meeting day."
      - name: race_name
        description: "Human-readable race name."
      - name: popularity
        description: "Latest available popularity when present, otherwise final popularity carried from the race-entry fact."
