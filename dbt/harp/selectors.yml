selectors:
  - name: nn_inputs
    description: Refresh shared pre-race values, full stored run history, and NN target entries; reuse existing contexts and statistical lookups.
    definition:
      method: tag
      value: nn_inputs
      # The independent LightGBM matrix may still contain an older refresh.
      exclude:
        - method: fqn
          value: shared_pre_race_feature_parity

  - name: nn_training
    description: Build NN inputs and their upstream contexts/statistics; no legacy manual odds snapshots.
    definition:
      method: fqn
      value: m_nn_race_entry
      parents: true
      exclude:
        - method: fqn
          value: shared_pre_race_feature_parity

  - name: nn_current
    description: Refresh current NN entries and shared live pre-race values, retaining an already built full run-history table. Use feature_input_mode=latest.
    definition:
      union:
        - method: fqn
          value: int_race_day_feature_context
        - method: fqn
          value: feat_race_entry_pre_race
        - method: fqn
          value: m_nn_race_entry
        - exclude:
            - method: fqn
              value: shared_pre_race_feature_parity

  - name: training_default
    description: Build logical training entries and versioned pre10m quotes; manual legacy snapshots are not refreshed.
    definition:
      union:
        - method: fqn
          value: m_training_inputs_v1
          parents: true
        - method: fqn
          value: int_odds_pre10m_v1
          parents: true
        # LightGBM builds must also work before NN marts have been created.
        - exclude:
            - method: fqn
              value: nn_entry_complete_field

  - name: odds_contract_v1
    description: Validate the current odds contract without rebuilding feature lookups.
    definition:
      method: tag
      value: odds_contract_v1

  - name: manual_fct_jodds_snapshot_refresh
    description: Manual refresh path for the heavy fct_jodds_snapshot model.
    definition:
      method: fqn
      value: fct_jodds_snapshot
      parents: true

  - name: manual_fct_jodds_umaren_snapshot_refresh
    description: Manual refresh path for the heavy fct_jodds_umaren_snapshot model.
    definition:
      method: fqn
      value: fct_jodds_umaren_snapshot
      parents: true

  - name: race_week_prepare
    description: Build static weekly race inputs and common feature matrix.
    definition:
      union:
        - method: tag
          value: race_week_static
        - method: tag
          value: feature_matrix
        - exclude:
            - method: fqn
              value: nn_entry_complete_field

  - name: race_day_update
    description: Refresh race-day odds, feature context/matrix, inference output, and its dependent training input view. Requires feature_input_mode=latest.
    definition:
      union:
        - method: tag
          value: race_day_live
        - method: tag
          value: inference
        # PostgreSQL view replacement drops dependent views via CASCADE.
        # Rebuild this view after m_race_inputs_v1 without refreshing its other parents.
        - method: fqn
          value: m_training_inputs_v1
        - exclude:
            - method: fqn
              value: nn_entry_complete_field

  - name: race_day_odds_update
    description: Refresh only the race-day odds tables from append-only s_jodds before feature-matrix joins.
    definition:
      method: tag
      value: race_day_odds

  - name: post_race_finalize
    description: Refresh post-race outcomes and training output.
    definition:
      union:
        - method: tag
          value: post_race
        - method: tag
          value: training
        - exclude:
            - method: fqn
              value: nn_entry_complete_field
