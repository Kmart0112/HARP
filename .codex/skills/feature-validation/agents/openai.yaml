interface:
  display_name: "Feature Validation"
  short_description: "Unified candidate-addition and existing-comparison validation workflow."
  default_prompt: "Use $feature-validation to decide whether horse-racing features should be adopted, held, or rejected. Choose `candidate_addition` when implementing or changing a feature through dbt, updating the dbt model YAML, registering any newly added mart column in `pipeline/config/feature_registry.yml` before validation as inventory only, creating a preset from `notebook/config/feature_validation_presets/template_feature_set.yml`, running `scripts/refresh_analysis_cache.sh --full-refresh` before the formal validation flow, then running `uv run python pipeline/jobs/run_feature_validation.py --preset ...`, reviewing MLflow evidence, and checking SHAP as a mandatory review point for every newly added feature. Keep new candidates out of the baseline set until adoption is decided; compare them through `include_features` and `include_cat_features` in preset scenarios. Do not run `--finalize` automatically; leave theme closing to a manual CLI step unless the user explicitly asks for it. Promote accepted features by updating `pipeline/config/feature_registry.yml` only after that manual close/review step, and use `pipeline/jobs/render_feature_set.py` only to confirm the rendered set. Choose `existing_comparison` when comparing already enabled features, preparing a preset from `notebook/config/feature_selection_presets/...`, running `uv run python pipeline/jobs/run_feature_selection.py --preset ...`, reviewing MLflow parent and child runs plus the generated report, runs CSV, and decisions CSV, and updating registry `set_status` values for winners and losers when the enabled set changes."
