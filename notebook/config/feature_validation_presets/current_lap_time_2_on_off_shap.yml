version: 1

validation:
  name: current_lap_time_2_on_off_shap
  category: feature_engineering
  change_summary: compare_current_lap_time_2_on_off_with_shap
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_lap_time_2_on_off_shap_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_lap_time_2_on_off_shap_runs.csv"
  run_log_dir: "current_lap_time_2_on_off_shap_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current lap time 2 on/off with SHAP）"
  background: "当週調教の `wood_lap_time_2` と `hanro_lap_time_2` について、`lap_time_2` を外した baseline からそれぞれを単独で戻し、on/off 差分と SHAP 依存形を同一テーマで確認する。"
  hypothesis_lines:
    - "`wood_lap_time_2` は `wood_lap_time_1` に対して中盤負荷の追加情報を持つ可能性がある。"
    - "`hanro_lap_time_2` は `hanro_lap_time_1` に対して追加情報を持つ可能性がある。"
    - "同一 baseline で比較することで、当週 lap_time_2 の木曜系と坂路系の差を揃えて確認する。"
  leakage_notes:
    - "as-of: いずれも対象レースの3-4日前までに確定している当週調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `held_date` 以後の調教データは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "baseline では `wood_lap_time_2` と `hanro_lap_time_2` を明示的に exclude する。"
    - "比較は `add_wood_lap_time_2` と `add_hanro_lap_time_2` の単独 on のみ。"
    - "SHAP では `wood_lap_time_1` / `hanro_lap_time_1` を比較軸に依存形を見る。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: wood_lap_time_2
    feature_type: num
    change_type: compare_existing
    summary: 当週の代表ウッド調教から採用した2Fラップ時計。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.wood_lap_time_2

  - feature_name: hanro_lap_time_2
    feature_type: num
    change_type: compare_existing
    summary: 当週の代表坂路調教から採用した2Fラップ時計。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_lap_time_2

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [wood_lap_time_2, hanro_lap_time_2]

  - scenario_name: add_wood_lap_time_2
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [wood_lap_time_2, hanro_lap_time_2]
      include_features: [wood_lap_time_2]
    shap:
      candidate_feature: wood_lap_time_2
      comparison_features: [wood_lap_time_1]
      report_run_label: wood_lap_time_2

  - scenario_name: add_hanro_lap_time_2
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [wood_lap_time_2, hanro_lap_time_2]
      include_features: [hanro_lap_time_2]
    shap:
      candidate_feature: hanro_lap_time_2
      comparison_features: [hanro_lap_time_1]
      report_run_label: hanro_lap_time_2
