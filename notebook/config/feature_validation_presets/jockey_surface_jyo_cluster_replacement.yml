version: 1

validation:
  name: jockey_surface_jyo_cluster_replacement
  category: feature_engineering
  change_summary: compare_jockey_surface_jyo_cluster_replacement_variants
  experiment_name: feature_validation

outputs:
  report_file: "{date}_jockey_surface_jyo_cluster_replacement_feature_definition_validation_report.md"
  runs_csv_file: "{date}_jockey_surface_jyo_cluster_replacement_runs.csv"
  run_log_dir: "jockey_surface_jyo_cluster_replacement_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（jockey surface×jyo replacement）"
  background: "既存採用中の `jockey_cluster_avg_place_rate_corrected` を維持するか、`surface×jyo_cd` 系の騎手TEへ置き換えるかを MLflow の正式運用で再検証する。"
  hypothesis_lines:
    - "`jockey_surface_jyo_place_rate_3y_smooth` は add-on では弱かったが、`cluster` との純置換では改善余地がある。"
    - "`jockey_surface_jyo_avg_diff_logit_smooth` は overall 騎手強さとの差を logit 空間で持つことで、冗長性を減らしつつ置換候補になりうる。"
    - "winner 判定は `DeltaAUC > 0` かつ `DeltaLogLoss < 0` を基本とし、5 scenario の formal evidence を MLflow に残す。"
  leakage_notes:
    - "as-of: `jockey_surface_jyo_place_rate_3y_smooth` は `held_year_month` 単位で当月除外の過去集計であり、対象レース発走前に確定している。"
    - "`jockey_surface_jyo_avg_diff_logit_smooth` は同じ過去集計列同士の変換差分で、対象レース結果や払戻を使わない。"
    - "将来情報不使用: いずれも対象年月より後のレースは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "`jockey_surface_jyo_place_rate_3y_smooth` と `jockey_surface_jyo_avg_diff_logit_smooth` は base に未採用のため、各 scenario で明示的に include する。"
    - "`replace_*` scenario は `jockey_cluster_avg_place_rate_corrected` を外し、candidate 1本へ純置換する。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: jockey_surface_jyo_place_rate_3y_smooth
    feature_type: num
    change_type: add
    summary: 同一騎手×馬場×場コードにおける過去3年の平滑化複勝率。
    sections: [feature_names]
    comparison_features: [jockey_cluster_avg_place_rate_corrected]
    dbt_model_path: dbt/harp/models/features/jockey/feat_jockey_yearly_surface_jyo.sql
    dbt_yaml_path: dbt/harp/models/features/jockey/feat_jockey_yearly_surface_jyo.yml
    final_column: mart.m_train_race_horse_past5.jockey_surface_jyo_place_rate_3y_smooth

  - feature_name: jockey_surface_jyo_avg_diff_logit_smooth
    feature_type: num
    change_type: add
    summary: "`surface×jyo_cd` の平滑化複勝率と overall 平滑化複勝率の logit 差分。"
    sections: [feature_names]
    comparison_features: [jockey_cluster_avg_place_rate_corrected]
    dbt_model_path: dbt/harp/models/intermediate/entity/int_race_entry_metrics.sql
    dbt_yaml_path: dbt/harp/models/intermediate/entity/int_race_entry_metrics.yml
    final_column: mart.m_train_race_horse_past5.jockey_surface_jyo_avg_diff_logit_smooth

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_surface_jyo_smooth
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_surface_jyo_place_rate_3y_smooth]
      exclude_features: [jockey_surface_jyo_avg_diff_logit_smooth]
    shap:
      candidate_feature: jockey_surface_jyo_place_rate_3y_smooth
      comparison_features: [jockey_cluster_avg_place_rate_corrected]
      report_run_label: jockey_surface_jyo_smooth

  - scenario_name: add_surface_jyo_diff_logit_smooth
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_surface_jyo_avg_diff_logit_smooth]
      exclude_features: [jockey_surface_jyo_place_rate_3y_smooth]
    shap:
      candidate_feature: jockey_surface_jyo_avg_diff_logit_smooth
      comparison_features: [jockey_cluster_avg_place_rate_corrected]
      report_run_label: jockey_surface_jyo_diff_logit_smooth

  - scenario_name: replace_cluster_with_surface_jyo_smooth
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_surface_jyo_place_rate_3y_smooth]
      exclude_features: [jockey_cluster_avg_place_rate_corrected, jockey_surface_jyo_avg_diff_logit_smooth]

  - scenario_name: replace_cluster_with_surface_jyo_diff_logit_smooth
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_surface_jyo_avg_diff_logit_smooth]
      exclude_features: [jockey_cluster_avg_place_rate_corrected, jockey_surface_jyo_place_rate_3y_smooth]
