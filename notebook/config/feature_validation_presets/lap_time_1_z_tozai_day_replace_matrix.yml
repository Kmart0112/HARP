version: 1

validation:
  name: lap_time_1_z_tozai_day_replace_matrix
  category: feature_engineering
  change_summary: validate_lap_time_1_z_tozai_day_replace_matrix
  experiment_name: feature_validation

outputs:
  report_file: "{date}_lap_time_1_z_tozai_day_replace_matrix_feature_definition_validation_report.md"
  runs_csv_file: "{date}_lap_time_1_z_tozai_day_replace_matrix_runs.csv"
  run_log_dir: "lap_time_1_z_tozai_day_replace_matrix_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（lap time 1 z by tozai day replace matrix）"
  background: "既存の raw `lap_time_1` 系を `tozai_cd × chokyo_date` 基準の z-score に置換したとき、`current` / `p1` / `week1` のどの塊が最も有効かを比較する。"
  hypothesis_lines:
    - "`current` だけの置換でも、日次・東西差を吸収した `wood_lap_time_1_z_tozai_day` / `hanro_lap_time_1_z_tozai_day` が raw より安定する可能性がある。"
    - "`p1` や `week1` の置換価値は、対応する raw 特徴量との重複が強いため、family 単位で見ないと判定しにくい可能性がある。"
    - "`current + p1 + week1` をまとめて全面置換する前に、family ごとの置換差分を matrix で確認する。"
  leakage_notes:
    - "as-of: いずれも対象レース前に既知の当週・1週前調教時計と、過去レース時点で既知だった p1 調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `p1_*` は lag により過去レース時点の特徴量を参照している。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "registry 上で `hanro_lap_time_2` は既に off だが、比較条件を固定するため baseline でも明示的に exclude する。"
    - "candidate は `current` 2本、`p1` 2本、`week1` 2本の計6本。"
    - "各 replace scenario は対応する raw `lap_time_1` だけを外し、同じ family の z を入れる。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 当週の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.wood_lap_time_1_z_tozai_day

  - feature_name: hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 当週の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_lap_time_1_z_tozai_day

  - feature_name: p1_wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 直近1走前レース時点の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [p1_wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.p1_wood_lap_time_1_z_tozai_day

  - feature_name: p1_hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 直近1走前レース時点の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [p1_hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.p1_hanro_lap_time_1_z_tozai_day

  - feature_name: week1_wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 1週前の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [week1_wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_wood_lap_time_1_z_tozai_day

  - feature_name: week1_hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 1週前の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [week1_hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_hanro_lap_time_1_z_tozai_day

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]

  - scenario_name: replace_current_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_1, hanro_lap_time_1]
      include_features: [wood_lap_time_1_z_tozai_day, hanro_lap_time_1_z_tozai_day]

  - scenario_name: replace_p1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, p1_wood_lap_time_1, p1_hanro_lap_time_1]
      include_features: [p1_wood_lap_time_1_z_tozai_day, p1_hanro_lap_time_1_z_tozai_day]

  - scenario_name: replace_week1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, week1_wood_lap_time_1, week1_hanro_lap_time_1]
      include_features: [week1_wood_lap_time_1_z_tozai_day, week1_hanro_lap_time_1_z_tozai_day]

  - scenario_name: replace_current_p1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features:
        - hanro_lap_time_2
        - wood_lap_time_1
        - hanro_lap_time_1
        - p1_wood_lap_time_1
        - p1_hanro_lap_time_1
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day

  - scenario_name: replace_current_week1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features:
        - hanro_lap_time_2
        - wood_lap_time_1
        - hanro_lap_time_1
        - week1_wood_lap_time_1
        - week1_hanro_lap_time_1
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - week1_wood_lap_time_1_z_tozai_day
        - week1_hanro_lap_time_1_z_tozai_day

  - scenario_name: replace_p1_week1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features:
        - hanro_lap_time_2
        - p1_wood_lap_time_1
        - p1_hanro_lap_time_1
        - week1_wood_lap_time_1
        - week1_hanro_lap_time_1
      include_features:
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day
        - week1_wood_lap_time_1_z_tozai_day
        - week1_hanro_lap_time_1_z_tozai_day

  - scenario_name: replace_all_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features:
        - hanro_lap_time_2
        - wood_lap_time_1
        - hanro_lap_time_1
        - p1_wood_lap_time_1
        - p1_hanro_lap_time_1
        - week1_wood_lap_time_1
        - week1_hanro_lap_time_1
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day
        - week1_wood_lap_time_1_z_tozai_day
        - week1_hanro_lap_time_1_z_tozai_day
