version: 1

validation:
  name: current_trainer_lap_time_1_fast_excess_z
  category: feature_engineering
  change_summary: validate_current_trainer_lap_time_1_fast_excess_z
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_trainer_lap_time_1_fast_excess_z_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_trainer_lap_time_1_fast_excess_z_runs.csv"
  run_log_dir: "current_trainer_lap_time_1_fast_excess_z_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current trainer lap time 1 fast excess z）"
  background: "当週調教の raw `lap_time_1` を厩舎ごとの過去3年平均・標準偏差で正規化した relative z を、既存の `z_tozai_day` 系と比較しながら検証する。"
  hypothesis_lines:
    - "`trainer_wood_lap_time_1_fast_excess_z_3y` は raw wood 1F の絶対値ではなく、厩舎の通常パターンを超えて速いかどうかを表す signal になり得る。"
    - "`trainer_hanro_lap_time_1_fast_excess_z_3y` は raw hanro 1F の厩舎内相対位置を表し、既存の `hanro_lap_time_1_z_tozai_day` と異なる補完情報を持つ可能性がある。"
    - "今回は当週のみを対象に、current wood / hanro の2本だけで add と既存 current z 置換を確認する。"
  leakage_notes:
    - "as-of: いずれも対象レースの3-4日前までに確定している当週調教時計のみを使う。"
    - "集計境界: 厩舎基準は `held_year_month` ごとの直前36か月 rolling で、対象月は含めない。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "candidate は current の `trainer_wood_lap_time_1_fast_excess_z_3y` と `trainer_hanro_lap_time_1_fast_excess_z_3y` の2本のみ。"
    - "既存 ON の比較対象は `wood_lap_time_1_z_tozai_day` / `hanro_lap_time_1_z_tozai_day`。"
    - "raw `lap_time_1` 自体は place_v1 に含まれていないため、replace は current z family に対して行う。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: trainer_wood_lap_time_1_fast_excess_z_3y
    feature_type: num
    change_type: add
    summary: 当週の代表ウッド調教1Fが、同厩舎の過去3年平均よりどれだけ速いかを厩舎内標準偏差で正規化した relative z。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1_z_tozai_day, wood_lap_time_1]
    dbt_model_path: dbt/harp/models/features/workout/feat_workout_trainer_lap_time_1_metrics.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.trainer_wood_lap_time_1_fast_excess_z_3y

  - feature_name: trainer_hanro_lap_time_1_fast_excess_z_3y
    feature_type: num
    change_type: add
    summary: 当週の代表坂路調教1Fが、同厩舎の過去3年平均よりどれだけ速いかを厩舎内標準偏差で正規化した relative z。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1_z_tozai_day, hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/features/workout/feat_workout_trainer_lap_time_1_metrics.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.trainer_hanro_lap_time_1_fast_excess_z_3y

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_trainer_wood_lap_time_1_fast_excess_z_3y
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [trainer_wood_lap_time_1_fast_excess_z_3y]
    shap:
      candidate_feature: trainer_wood_lap_time_1_fast_excess_z_3y
      comparison_features: [wood_lap_time_1_z_tozai_day, wood_lap_time_1]
      report_run_label: trainer_wood_lap_time_1_fast_excess_z_3y

  - scenario_name: add_trainer_hanro_lap_time_1_fast_excess_z_3y
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [trainer_hanro_lap_time_1_fast_excess_z_3y]
    shap:
      candidate_feature: trainer_hanro_lap_time_1_fast_excess_z_3y
      comparison_features: [hanro_lap_time_1_z_tozai_day, hanro_lap_time_1]
      report_run_label: trainer_hanro_lap_time_1_fast_excess_z_3y

  - scenario_name: add_both_current_trainer_lap_time_1_fast_excess_z
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      include_features:
        - trainer_wood_lap_time_1_fast_excess_z_3y
        - trainer_hanro_lap_time_1_fast_excess_z_3y

  - scenario_name: replace_wood_lap_time_1_z_tozai_day_with_trainer_fast_excess
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [trainer_wood_lap_time_1_fast_excess_z_3y]
      exclude_features: [wood_lap_time_1_z_tozai_day]

  - scenario_name: replace_hanro_lap_time_1_z_tozai_day_with_trainer_fast_excess
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [trainer_hanro_lap_time_1_fast_excess_z_3y]
      exclude_features: [hanro_lap_time_1_z_tozai_day]

  - scenario_name: replace_both_current_lap_time_1_z_with_trainer_fast_excess
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features:
        - trainer_wood_lap_time_1_fast_excess_z_3y
        - trainer_hanro_lap_time_1_fast_excess_z_3y
      exclude_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
