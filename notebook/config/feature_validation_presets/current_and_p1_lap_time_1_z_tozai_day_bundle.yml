version: 1

validation:
  name: current_and_p1_lap_time_1_z_tozai_day_bundle
  category: feature_engineering
  change_summary: validate_current_and_p1_lap_time_1_z_tozai_day_bundle
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_and_p1_lap_time_1_z_tozai_day_bundle_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_and_p1_lap_time_1_z_tozai_day_bundle_runs.csv"
  run_log_dir: "current_and_p1_lap_time_1_z_tozai_day_bundle_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current and p1 lap time 1 z by tozai day bundle）"
  background: "当週と直近1走前の調教 `lap_time_1` を `tozai_cd × chokyo_date` 単位で標準化した z-score 群を、既存 raw 特徴量に対する bundle add と bundle replace の2パターンで検証する。"
  hypothesis_lines:
    - "当週の `wood_lap_time_1_z_tozai_day` / `hanro_lap_time_1_z_tozai_day` と、過去側の `p1_*_lap_time_1_z_tozai_day` をまとめて入れると、raw より日次・東西差を吸収した一貫した調教 signal になる可能性がある。"
    - "当週 raw と p1 raw を対応する z にまとめて置換すると、raw 混在よりも current/p1 間の表現が揃い、汎化が改善する可能性がある。"
    - "今回は bundle 全体の有効性だけを見たいので、single add は置かずに add_all / replace_all の2比較に絞る。"
  leakage_notes:
    - "as-of: いずれも各レース時点で既知の当週調教時計と、その1走前レース時点で既知だった調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `p1_*` は lag により過去レース時点の特徴量を参照している。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "registry 上で `hanro_lap_time_2` は既に off だが、baseline でも明示的に exclude して比較条件を固定する。"
    - "candidate は当週2本と p1 2本の計4本。"
    - "add scenario は raw current / raw p1 を残したまま z 群をまとめて追加する。"
    - "replace scenario は `wood_lap_time_1` / `hanro_lap_time_1` / `p1_wood_lap_time_1` / `p1_hanro_lap_time_1` をまとめて外し、対応する z 群4本へ置換する。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 当週の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.wood_lap_time_1_z_tozai_day

  - feature_name: hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 当週の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_lap_time_1_z_tozai_day

  - feature_name: p1_wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 直近1走前レース時点の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [p1_wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.p1_wood_lap_time_1_z_tozai_day

  - feature_name: p1_hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 直近1走前レース時点の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [p1_hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.p1_hanro_lap_time_1_z_tozai_day

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]

  - scenario_name: add_all_current_and_p1_lap_time_1_z
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day

  - scenario_name: replace_all_current_and_p1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features:
        - hanro_lap_time_2
        - wood_lap_time_1
        - hanro_lap_time_1
        - p1_wood_lap_time_1
        - p1_hanro_lap_time_1
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day
