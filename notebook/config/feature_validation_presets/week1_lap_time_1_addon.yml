version: 1

validation:
  name: week1_lap_time_1_addon
  category: feature_engineering
  change_summary: validate_week1_lap_time_1_addon
  experiment_name: feature_validation

outputs:
  report_file: "{date}_week1_lap_time_1_addon_feature_definition_validation_report.md"
  runs_csv_file: "{date}_week1_lap_time_1_addon_runs.csv"
  run_log_dir: "week1_lap_time_1_addon_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（week1 lap time 1 add-on）"
  background: "直前3-4日前の調教1Fに対して、10-11日前の1週前調教1Fを add-on として足す価値があるかを最小構成で確認する。"
  hypothesis_lines:
    - "`week1_wood_lap_time_1` は直前追い切りだけでは拾いにくい仕上げ過程を補足できる。"
    - "`week1_hanro_lap_time_1` は坂路の1週前負荷を別軸で補足できる。"
    - "初回は 1F のみを候補にして、他の week1 系は評価対象に含めない。"
  leakage_notes:
    - "as-of: いずれも対象レースの10-11日前までに確定している調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `held_date` 以後の調教データは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "candidate は `week1_wood_lap_time_1` と `week1_hanro_lap_time_1` の2本のみ。"
    - "比較対象は既存採用済みの `wood_lap_time_1` / `hanro_lap_time_1`。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: week1_wood_lap_time_1
    feature_type: num
    change_type: add
    summary: 10-11日前の代表ウッド調教から採用した最終1F時計。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_wood_lap_time_1

  - feature_name: week1_hanro_lap_time_1
    feature_type: num
    change_type: add
    summary: 10-11日前の代表坂路調教から採用した最終1F時計。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_hanro_lap_time_1

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_week1_wood_lap_time_1
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [week1_wood_lap_time_1]
    shap:
      candidate_feature: week1_wood_lap_time_1
      comparison_features: [wood_lap_time_1]
      report_run_label: week1_wood_lap_time_1

  - scenario_name: add_week1_hanro_lap_time_1
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [week1_hanro_lap_time_1]
    shap:
      candidate_feature: week1_hanro_lap_time_1
      comparison_features: [hanro_lap_time_1]
      report_run_label: week1_hanro_lap_time_1

  - scenario_name: add_both_week1_lap_time_1
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      include_features:
        - week1_wood_lap_time_1
        - week1_hanro_lap_time_1

  - scenario_name: replace_wood_lap_time_1_with_week1
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [week1_wood_lap_time_1]
      exclude_features: [wood_lap_time_1]

  - scenario_name: replace_hanro_lap_time_1_with_week1
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [week1_hanro_lap_time_1]
      exclude_features: [hanro_lap_time_1]
