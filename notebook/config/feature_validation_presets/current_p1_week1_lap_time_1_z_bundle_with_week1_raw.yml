version: 1

validation:
  name: current_p1_week1_lap_time_1_z_bundle_with_week1_raw
  category: feature_engineering
  change_summary: validate_current_p1_week1_lap_time_1_z_bundle_with_week1_raw
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_p1_week1_lap_time_1_z_bundle_with_week1_raw_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_p1_week1_lap_time_1_z_bundle_with_week1_raw_runs.csv"
  run_log_dir: "current_p1_week1_lap_time_1_z_bundle_with_week1_raw_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current p1 week1 lap time 1 z bundle with week1 raw）"
  background: "当週と直近1走前の `lap_time_1` z bundle に加えて、1週前の `lap_time_1` z もまとめて追加し、baseline には既存の `week1 raw` を残したまま、z bundle の純増価値を確認する。"
  hypothesis_lines:
    - "`week1_wood_lap_time_1` と `week1_hanro_lap_time_1` を baseline に残した状態でも、対応する `week1_*_lap_time_1_z_tozai_day` を current/p1 z bundle に加えることで追加の signal が得られる可能性がある。"
    - "`current + p1 + week1` の z をまとめて add したとき、week1 raw と重複しつつも、日次・東西差を吸収した表現として確率品質を押し上げる可能性がある。"
    - "今回は add の上積み確認が目的なので、baseline と add_all の2比較に絞る。"
  leakage_notes:
    - "as-of: いずれも対象レース前に確定している当週・1週前調教時計と、過去レース時点で既知だった p1 調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `p1_*` は lag により過去レース時点の特徴量を参照している。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "baseline は `week1_wood_lap_time_1` / `week1_hanro_lap_time_1` を含む通常の `place_v1` を使う。"
    - "registry 上で `hanro_lap_time_2` は既に off だが、比較条件を固定するため baseline でも明示的に exclude する。"
    - "candidate は current 2本、p1 2本、week1 2本の計6本。"
    - "add scenario は raw current / raw p1 / raw week1 を残したまま、current+p1+week1 の z 群をまとめて追加する。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 当週の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.wood_lap_time_1_z_tozai_day

  - feature_name: hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 当週の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_lap_time_1_z_tozai_day

  - feature_name: p1_wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 直近1走前レース時点の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [p1_wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.p1_wood_lap_time_1_z_tozai_day

  - feature_name: p1_hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 直近1走前レース時点の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [p1_hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.p1_hanro_lap_time_1_z_tozai_day

  - feature_name: week1_wood_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 1週前の代表ウッド調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [week1_wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_wood_lap_time_1_z_tozai_day

  - feature_name: week1_hanro_lap_time_1_z_tozai_day
    feature_type: num
    change_type: add
    summary: 1週前の代表坂路調教1Fを `tozai_cd × chokyo_date` 単位で標準化した z-score。
    sections: [feature_names]
    comparison_features: [week1_hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_hanro_lap_time_1_z_tozai_day

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]

  - scenario_name: add_all_current_p1_week1_lap_time_1_z
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day
        - week1_wood_lap_time_1_z_tozai_day
        - week1_hanro_lap_time_1_z_tozai_day

  - scenario_name: replace_all_current_p1_week1_lap_time_1_with_z
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features:
        - hanro_lap_time_2
        - wood_lap_time_1
        - hanro_lap_time_1
        - p1_wood_lap_time_1
        - p1_hanro_lap_time_1
        - week1_wood_lap_time_1
        - week1_hanro_lap_time_1
      include_features:
        - wood_lap_time_1_z_tozai_day
        - hanro_lap_time_1_z_tozai_day
        - p1_wood_lap_time_1_z_tozai_day
        - p1_hanro_lap_time_1_z_tozai_day
        - week1_wood_lap_time_1_z_tozai_day
        - week1_hanro_lap_time_1_z_tozai_day
