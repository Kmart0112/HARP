version: 1

validation:
  name: current_hanro_lap_time_2_on_off
  category: feature_engineering
  change_summary: compare_current_hanro_lap_time_2_on_off
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_hanro_lap_time_2_on_off_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_hanro_lap_time_2_on_off_runs.csv"
  run_log_dir: "current_hanro_lap_time_2_on_off_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current hanro lap time 2 on/off）"
  background: "当週調教の `hanro_lap_time_2` について、現在の `place_v1` から当該特徴量だけを外した baseline と on 状態を比較する。"
  hypothesis_lines:
    - "`hanro_lap_time_2` は `hanro_lap_time_1` に対して追加情報を持ち、単独 on で metrics を改善する可能性がある。"
    - "今回は `hanro_lap_time_2` の on/off 差分だけを確認し、他の調教特徴量は変更しない。"
  leakage_notes:
    - "as-of: いずれも対象レースの3-4日前までに確定している当週坂路調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `held_date` 以後の調教データは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "baseline では `hanro_lap_time_2` のみを明示的に exclude する。"
    - "比較シナリオでは `hanro_lap_time_2` を再度 include し、純粋な on/off を取る。"
    - "SHAP は回さず、まず metrics-only で効果差を確認する。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: hanro_lap_time_2
    feature_type: num
    change_type: compare_existing
    summary: 当週の代表坂路調教から採用した2Fラップ時計。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_lap_time_2

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]

  - scenario_name: add_hanro_lap_time_2
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2]
      include_features: [hanro_lap_time_2]
