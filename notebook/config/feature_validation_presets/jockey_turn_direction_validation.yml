version: 1

validation:
  name: jockey_turn_direction_validation
  category: feature_engineering
  change_summary: compare_jockey_turn_direction_variants
  experiment_name: feature_validation

outputs:
  report_file: "{date}_jockey_turn_direction_validation_feature_definition_validation_report.md"
  runs_csv_file: "{date}_jockey_turn_direction_validation_runs.csv"
  run_log_dir: "jockey_turn_direction_validation_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（jockey turn_direction）"
  background: "騎手TEを `turn_direction` 単独で集計したときに、平滑化複勝率そのものと overall 騎手力との差分 logit のどちらが add-on として有効かを `place_v1` で formal validation する。"
  hypothesis_lines:
    - "`jockey_turn_direction_place_rate_3y_smooth` は左右回り・直線適性を surface から独立した形で補足できる。"
    - "`jockey_turn_direction_avg_diff_logit_smooth` は overall 騎手力との差を持つことで、既存騎手TEとの冗長性を減らせる可能性がある。"
    - "winner 判定は `DeltaAUC > 0` かつ `DeltaLogLoss < 0` を基本とし、単独追加の 2 scenario で SHAP まで確認する。"
  leakage_notes:
    - "as-of: いずれの candidate も `held_year_month` 単位で当月除外の過去集計から計算し、対象レース発走前に確定している。"
    - "`turn_direction` はレース前に確定している静的コース属性のみを使う。"
    - "`jockey_turn_direction_avg_diff_logit_smooth` は同じ過去集計列同士の変換差分であり、対象レース結果や払戻を使わない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "candidate 2列は base に未採用のため、各 scenario で明示的に include する。"
    - "`add_both_turn_direction` は 2 列を同時投入し、単独追加とあわせて比較する。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: jockey_turn_direction_place_rate_3y_smooth
    feature_type: num
    change_type: add
    summary: "同一騎手×turn_direction における過去3年の平滑化複勝率。"
    sections: [feature_names]
    comparison_features: [jockey_surface_turn_direction_avg_diff_logit_smooth, jockey_cluster_avg_place_rate_corrected, same_turn_direction_avg_pos4_agari_synergy]
    dbt_model_path: dbt/harp/models/features/jockey/feat_jockey_yearly_turn_direction.sql
    dbt_yaml_path: dbt/harp/models/features/jockey/feat_jockey_yearly_turn_direction.yml
    final_column: mart.m_train_race_horse_past5.jockey_turn_direction_place_rate_3y_smooth

  - feature_name: jockey_turn_direction_avg_diff_logit_smooth
    feature_type: num
    change_type: add
    summary: "`turn_direction` の平滑化複勝率と overall 平滑化複勝率の logit 差分。"
    sections: [feature_names]
    comparison_features: [jockey_surface_turn_direction_avg_diff_logit_smooth, jockey_cluster_avg_place_rate_corrected, same_turn_direction_avg_pos4_agari_synergy]
    dbt_model_path: dbt/harp/models/intermediate/entity/int_race_entry_metrics.sql
    dbt_yaml_path: dbt/harp/models/intermediate/entity/int_race_entry_metrics.yml
    final_column: mart.m_train_race_horse_past5.jockey_turn_direction_avg_diff_logit_smooth

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_turn_direction_smooth
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_turn_direction_place_rate_3y_smooth]
      exclude_features: [jockey_turn_direction_avg_diff_logit_smooth]
    shap:
      candidate_feature: jockey_turn_direction_place_rate_3y_smooth
      comparison_features: [jockey_surface_turn_direction_avg_diff_logit_smooth, jockey_cluster_avg_place_rate_corrected, same_turn_direction_avg_pos4_agari_synergy]
      report_run_label: jockey_turn_direction_smooth

  - scenario_name: add_turn_direction_diff_logit_smooth
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_turn_direction_avg_diff_logit_smooth]
      exclude_features: [jockey_turn_direction_place_rate_3y_smooth]
    shap:
      candidate_feature: jockey_turn_direction_avg_diff_logit_smooth
      comparison_features: [jockey_surface_turn_direction_avg_diff_logit_smooth, jockey_cluster_avg_place_rate_corrected, same_turn_direction_avg_pos4_agari_synergy]
      report_run_label: jockey_turn_direction_diff_logit_smooth

  - scenario_name: add_both_turn_direction
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      include_features:
        - jockey_turn_direction_place_rate_3y_smooth
        - jockey_turn_direction_avg_diff_logit_smooth
