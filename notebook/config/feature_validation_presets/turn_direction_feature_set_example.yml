version: 1

validation:
  name: turn_direction_feature_set_example
  category: feature_engineering
  change_summary: add_turn_direction_via_feature_set
  experiment_name: feature_validation

outputs:
  report_file: "{date}_turn_direction_feature_set_example_report.md"
  runs_csv_file: "{date}_turn_direction_feature_set_example_runs.csv"
  run_log_dir: "turn_direction_feature_set_example_logs_{date}"

report:
  title: "特徴量検証レポート（turn_direction feature_set example）"
  background: "feature_set を土台に、turn_direction を include して差分検証する実例。"
  hypothesis_lines:
    - "`turn_direction` は左右回り差を直接補足し、既存条件別履歴特徴を補完する。"
  leakage_notes:
    - "as-of: 当該レースの静的コース属性なのでレース前に既知。"
    - "対象レース結果の情報は不使用。"
  implementation_notes:
    - "feature_set base: `place_v1`"
    - "必須比較: baseline / single_add / add_all / replace_existing をすべて入れる。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: turn_direction
    feature_type: cat
    change_type: add
    summary: 当該レースの左右回り/直線コース区分を直接使う。
    sections: [feature_names, cat_features]
    comparison_features: [same_turn_direction_surface_avg_pos4_agari_synergy]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.turn_direction

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_turn_direction_raw
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [turn_direction]
      include_cat_features: [turn_direction]
    shap:
      candidate_feature: turn_direction
      comparison_features: [same_turn_direction_surface_avg_pos4_agari_synergy]
      report_run_label: turn_direction_feature_set_example

  - scenario_name: add_all_turn_direction_candidates
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [turn_direction]
      include_cat_features: [turn_direction]

  - scenario_name: replace_turn_history_with_raw
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [turn_direction]
      include_cat_features: [turn_direction]
      exclude_features: [same_turn_direction_surface_avg_pos4_agari_synergy]
