version: 1

validation:
  name: time_diff_wavg5_recent_relative_variants
  category: feature_engineering
  change_summary: compare_time_diff_wavg5_recent_relative_variants
  experiment_name: feature_validation

outputs:
  report_file: "{date}_time_diff_wavg5_recent_relative_variants_feature_definition_validation_report.md"
  runs_csv_file: "{date}_time_diff_wavg5_recent_relative_variants_runs.csv"
  run_log_dir: "time_diff_wavg5_recent_relative_variants_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（time_diff_wavg5_recent relative variants）"
  background: "現行 active set では `time_diff_wavg5_recent` の raw を固定しつつ `z` と `rank` が併用されているため、relative 表現を `rank / z / robust` の standalone 比較で整理する。"
  hypothesis_lines:
    - "`time_diff_wavg5_recent` は raw を固定し、relative 表現だけを比較する。"
    - "勝者は `rank / z / robust` の standalone scenario 3本のうち 1 本に絞る。"
    - "`DeltaAUC > 1e-5` かつ `DeltaLogLoss < -1e-5` を満たす scenario があれば採用候補とし、全候補が未達なら relative best を記録して保留とする。"
  leakage_notes:
    - "as-of: `time_diff_wavg5_recent` は過去走由来であり、対象レース発走前に確定している。"
    - "対象レース結果の情報は不使用。race内 robust も当該レースの事前特徴量のみから算出する。"
    - "将来情報不使用: 当該レース以降の結果や派生集計は使わない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "`time_diff_wavg5_recent` raw は全 scenario で固定 ON とする。"
    - "`baseline_existing` は reference であり winner 候補には含めない。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: time_diff_wavg5_recent_rank
    feature_type: num
    change_type: keep_or_drop
    summary: race内昇順 rank。relative 表現の現行 winner 候補。
    sections: [feature_names]
    comparison_features: [time_diff_wavg5_recent_z, time_diff_wavg5_recent_robust]
    dbt_model_path: dbt/harp/models/features/base/feat_race_relative_z.sql
    dbt_yaml_path: dbt/harp/models/features/base/feat_race_relative_z.yml
    final_column: mart.m_train_race_horse_past5.time_diff_wavg5_recent_rank

  - feature_name: time_diff_wavg5_recent_z
    feature_type: num
    change_type: keep_or_drop
    summary: race内 z-score。relative 表現の challenger。
    sections: [feature_names]
    comparison_features: [time_diff_wavg5_recent_rank, time_diff_wavg5_recent_robust]
    dbt_model_path: dbt/harp/models/features/base/feat_race_relative_z.sql
    dbt_yaml_path: dbt/harp/models/features/base/feat_race_relative_z.yml
    final_column: mart.m_train_race_horse_past5.time_diff_wavg5_recent_z

  - feature_name: time_diff_wavg5_recent_robust
    feature_type: num
    change_type: add
    summary: race内 `median / IQR` による robust scale。relative 表現の新候補。
    sections: [feature_names]
    comparison_features: [time_diff_wavg5_recent_rank, time_diff_wavg5_recent_z]
    dbt_model_path: dbt/harp/models/features/base/feat_race_relative_z.sql
    dbt_yaml_path: dbt/harp/models/features/base/feat_race_relative_z.yml
    final_column: mart.m_train_race_horse_past5.time_diff_wavg5_recent_robust

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: relative_rank_only
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [time_diff_wavg5_recent_z]

  - scenario_name: relative_z_only
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [time_diff_wavg5_recent_rank]

  - scenario_name: relative_robust_only
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [time_diff_wavg5_recent_robust]
      exclude_features: [time_diff_wavg5_recent_rank, time_diff_wavg5_recent_z]
    shap:
      candidate_feature: time_diff_wavg5_recent_robust
      comparison_features: [time_diff_wavg5_recent_rank, time_diff_wavg5_recent_z]
      report_run_label: time_diff_wavg5_recent_robust
