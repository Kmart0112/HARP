version: 1

validation:
  name: current_late_sharpness_addon
  category: feature_engineering
  change_summary: validate_current_late_sharpness_addon
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_late_sharpness_addon_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_late_sharpness_addon_runs.csv"
  run_log_dir: "current_late_sharpness_addon_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current late sharpness add-on）"
  background: "当週調教の `wood_late_sharpness` / `hanro_late_sharpness` を、既存の raw 調教時計を残した `place_v1` 上の add-on 候補として検証する。"
  hypothesis_lines:
    - "`wood_late_sharpness` は 4F 全体時計に対する終いの質を圧縮し、`wood_lap_time_1` / `wood_haron_time_4` だけでは拾いにくい差分を補足できる。"
    - "`hanro_late_sharpness` は坂路の終い重点の形を圧縮し、`hanro_lap_time_1` / `hanro_haron_time_4` に対する追加情報を持つ可能性がある。"
    - "今回は当週のみを対象に、単独追加2本と両方追加を同一 theme で確認する。"
  leakage_notes:
    - "as-of: いずれも対象レースの3-4日前までに確定している当週調教時計から計算した特徴量のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `held_date` 以後の調教データは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "candidate は `wood_late_sharpness` と `hanro_late_sharpness` の2本のみ。"
    - "baseline は現行 `place_v1` をそのまま使い、raw `lap_time_1` / `haron_time_4` は残す。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: wood_late_sharpness
    feature_type: num
    change_type: add
    summary: 当週の代表ウッド調教について、前半3F平均に対する終い1Fの鋭さを表す相対指標。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1, wood_haron_time_4]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.wood_late_sharpness

  - feature_name: hanro_late_sharpness
    feature_type: num
    change_type: add
    summary: 当週の代表坂路調教について、前半3F平均に対する終い1Fの鋭さを表す相対指標。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1, hanro_haron_time_4]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_late_sharpness

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_wood_late_sharpness
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [wood_late_sharpness]
    shap:
      candidate_feature: wood_late_sharpness
      comparison_features: [wood_lap_time_1, wood_haron_time_4]
      report_run_label: wood_late_sharpness

  - scenario_name: add_hanro_late_sharpness
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [hanro_late_sharpness]
    shap:
      candidate_feature: hanro_late_sharpness
      comparison_features: [hanro_lap_time_1, hanro_haron_time_4]
      report_run_label: hanro_late_sharpness

  - scenario_name: add_both_late_sharpness
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      include_features:
        - wood_late_sharpness
        - hanro_late_sharpness
