version: 1

validation:
  name: current_haron_time_4_without_lap_time_2
  category: feature_engineering
  change_summary: validate_current_haron_time_4_with_lap_time_2_off
  experiment_name: feature_validation

outputs:
  report_file: "{date}_current_haron_time_4_without_lap_time_2_feature_definition_validation_report.md"
  runs_csv_file: "{date}_current_haron_time_4_without_lap_time_2_runs.csv"
  run_log_dir: "current_haron_time_4_without_lap_time_2_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（current haron time 4 with lap_time_2 off）"
  background: "当週調教の haron_time_4 を、lap_time_1 は残しつつ lap_time_2 を外した基準で add-on 検証する。"
  hypothesis_lines:
    - "`wood_haron_time_4` は当週ウッドの持続負荷を補足できる。"
    - "`hanro_haron_time_4` は `hanro_lap_time_2` を外した条件なら追加価値を出せる可能性がある。"
    - "今回は単独追加2本と両方追加を確認する。"
  leakage_notes:
    - "as-of: いずれも対象レースの3-4日前までに確定している当週調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `held_date` 以後の調教データは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "baseline では `hanro_lap_time_2` と `wood_lap_time_2` を明示的に exclude する。"
    - "candidate は `wood_haron_time_4` と `hanro_haron_time_4` の2本のみ。"
    - "比較対象は `wood_lap_time_1` / `hanro_lap_time_1` を主軸に見る。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: wood_haron_time_4
    feature_type: num
    change_type: add
    summary: 当週の代表ウッド調教から採用した4Fハロン時計。
    sections: [feature_names]
    comparison_features: [wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.wood_haron_time_4

  - feature_name: hanro_haron_time_4
    feature_type: num
    change_type: add
    summary: 当週の代表坂路調教から採用した4Fハロン時計。
    sections: [feature_names]
    comparison_features: [hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.hanro_haron_time_4

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]

  - scenario_name: add_wood_haron_time_4
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]
      include_features: [wood_haron_time_4]
    shap:
      candidate_feature: wood_haron_time_4
      comparison_features: [wood_lap_time_1]
      report_run_label: wood_haron_time_4

  - scenario_name: add_hanro_haron_time_4
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]
      include_features: [hanro_haron_time_4]
    shap:
      candidate_feature: hanro_haron_time_4
      comparison_features: [hanro_lap_time_1]
      report_run_label: hanro_haron_time_4

  - scenario_name: add_both_haron_time_4
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]
      include_features:
        - wood_haron_time_4
        - hanro_haron_time_4
