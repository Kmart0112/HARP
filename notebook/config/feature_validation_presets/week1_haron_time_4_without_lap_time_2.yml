version: 1

validation:
  name: week1_haron_time_4_without_lap_time_2
  category: feature_engineering
  change_summary: validate_week1_haron_time_4_with_lap_time_2_off
  experiment_name: feature_validation

outputs:
  report_file: "{date}_week1_haron_time_4_without_lap_time_2_feature_definition_validation_report.md"
  runs_csv_file: "{date}_week1_haron_time_4_without_lap_time_2_runs.csv"
  run_log_dir: "week1_haron_time_4_without_lap_time_2_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（week1 haron time 4 with lap_time_2 off）"
  background: "採用済みの week1 lap_time_1 は残しつつ、`hanro_lap_time_2` を外した基準で week1 haron_time_4 を add-on 検証する。"
  hypothesis_lines:
    - "`week1_wood_haron_time_4` は week1 1F とは異なる持続負荷を補足できる。"
    - "`week1_hanro_haron_time_4` は `hanro_lap_time_2` を外した条件なら追加価値を出せる可能性がある。"
    - "今回は `lap_time_2` を切った baseline に対する単独追加と両方追加だけを見る。"
  leakage_notes:
    - "as-of: いずれも対象レースの10-11日前までに確定している調教時計のみを使う。"
    - "対象レースの結果情報不使用: 着順・払戻・確定後指標は使わない。"
    - "将来情報不使用: `held_date` 以後の調教データは参照しない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "baseline では `hanro_lap_time_2` を明示的に exclude する。"
    - "candidate は `week1_wood_haron_time_4` と `week1_hanro_haron_time_4` の2本のみ。"
    - "比較対象は `wood_haron_time_4` / `hanro_haron_time_4` を基本に見る。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: week1_wood_haron_time_4
    feature_type: num
    change_type: add
    summary: 10-11日前の代表ウッド調教から採用した4Fハロン時計。
    sections: [feature_names]
    comparison_features: [wood_haron_time_4, week1_wood_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_wood_haron_time_4

  - feature_name: week1_hanro_haron_time_4
    feature_type: num
    change_type: add
    summary: 10-11日前の代表坂路調教から採用した4Fハロン時計。
    sections: [feature_names]
    comparison_features: [hanro_haron_time_4, week1_hanro_lap_time_1]
    dbt_model_path: dbt/harp/models/mart/training/m_train_race_horse_past5.sql
    dbt_yaml_path: dbt/harp/models/mart/training/m_train_race_horse_past5.yml
    final_column: mart.m_train_race_horse_past5.week1_hanro_haron_time_4

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]

  - scenario_name: add_week1_wood_haron_time_4
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]
      include_features: [week1_wood_haron_time_4]
    shap:
      candidate_feature: week1_wood_haron_time_4
      comparison_features: [wood_haron_time_4, week1_wood_lap_time_1]
      report_run_label: week1_wood_haron_time_4

  - scenario_name: add_week1_hanro_haron_time_4
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]
      include_features: [week1_hanro_haron_time_4]
    shap:
      candidate_feature: week1_hanro_haron_time_4
      comparison_features: [hanro_haron_time_4, week1_hanro_lap_time_1]
      report_run_label: week1_hanro_haron_time_4

  - scenario_name: add_both_week1_haron_time_4
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      exclude_features: [hanro_lap_time_2, wood_lap_time_2]
      include_features:
        - week1_wood_haron_time_4
        - week1_hanro_haron_time_4
