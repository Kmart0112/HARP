version: 1

validation:
  name: jockey_pos4_bin_soft_aggregation
  category: feature_engineering
  change_summary: validate_jockey_pos4_bin_soft_aggregation
  experiment_name: feature_validation

outputs:
  report_file: "{date}_jockey_pos4_bin_soft_aggregation_feature_definition_validation_report.md"
  runs_csv_file: "{date}_jockey_pos4_bin_soft_aggregation_runs.csv"
  run_log_dir: "jockey_pos4_bin_soft_aggregation_logs_{date}"

report:
  title: "特徴量定義・検証統合レポート（jockey pos4 bin soft aggregation）"
  background: "騎手TEの条件軸を running_style から pred_pos4 ベースの 5-bin へ移し、hard bin と soft aggregation のどちらが有効かを `place_v1` で formal validation する。"
  hypothesis_lines:
    - "`jockey_pos4_bin5_place_rate_3y_smooth_hard` は running_style より連続値に近い位置取り文脈を保ったまま、単純な hard bucket として使える。"
    - "`jockey_pos4_bin5_place_rate_3y_smooth_soft` は hard bucket の境界ノイズを減らし、予測位置取りに滑らかに追従できる。"
    - "`jockey_pos4_bin5_relative_place_rate_3y_smooth_soft` は bin 自体の base rate を差し引いた相対適性として、既存 jockey style TE より冗長性を下げられる可能性がある。"
  leakage_notes:
    - "as-of: `feat_jockey_pos4_bin` は `held_year_month` 単位で当月除外の過去集計から計算し、対象レース発走前に確定している。"
    - "`pred_pos4_for_jockey_te` は対象馬の過去走由来 `horse_corner4_wavg5_recent -> avg5 -> avg3` のみを使い、対象レース結果を参照しない。"
    - "soft aggregation は過去TE列の重み付き平均であり、将来情報や対象レース結果を使わない。"
  implementation_notes:
    - "base feature_set: `place_v1`"
    - "`jockey_style_place_rate_3y_smooth` は baseline では維持し、replace scenario のみで外す。"
    - "hard/soft の starts 系は observability 用に mart に出すが、validation scenario には含めない。"
    - "source registry は書き換えず、scenario ごとの一時 config を使う。"
  metrics_notebook_path: notebook/prd/lgbm_fuku_platt_metrics.py
  shap_notebook_path: notebook/lab/lgbm_fuku_platt_shap.py

target_features:
  - feature_name: jockey_pos4_bin5_place_rate_3y_smooth_hard
    feature_type: num
    change_type: add
    summary: "pred_pos4 の hard 5-bin で join した same-jockey pos4_bin の平滑化複勝率。"
    sections: [feature_names]
    comparison_features: [jockey_style_place_rate_3y_smooth, jockey_avg_place_rate_smooth]
    dbt_model_path: dbt/harp/models/features/jockey/feat_jockey_pos4_bin.sql
    dbt_yaml_path: dbt/harp/models/features/jockey/feat_jockey_pos4_bin.yml
    final_column: mart.m_train_race_horse_past5.jockey_pos4_bin5_place_rate_3y_smooth_hard

  - feature_name: jockey_pos4_bin5_place_rate_3y_smooth_soft
    feature_type: num
    change_type: add
    summary: "pred_pos4 の soft 5-bin 重みで集約した same-jockey pos4_bin の平滑化複勝率。"
    sections: [feature_names]
    comparison_features: [jockey_pos4_bin5_place_rate_3y_smooth_hard, jockey_style_place_rate_3y_smooth]
    dbt_model_path: dbt/harp/models/features/jockey/feat_jockey_pos4_bin.sql
    dbt_yaml_path: dbt/harp/models/features/jockey/feat_jockey_pos4_bin.yml
    final_column: mart.m_train_race_horse_past5.jockey_pos4_bin5_place_rate_3y_smooth_soft

  - feature_name: jockey_pos4_bin5_relative_place_rate_3y_smooth_soft
    feature_type: num
    change_type: add
    summary: "pred_pos4 の soft 5-bin 重みで集約した same-jockey pos4_bin の相対複勝率。"
    sections: [feature_names]
    comparison_features: [jockey_style_place_rate_3y_smooth, jockey_avg_place_rate_smooth]
    dbt_model_path: dbt/harp/models/features/jockey/feat_jockey_pos4_bin.sql
    dbt_yaml_path: dbt/harp/models/features/jockey/feat_jockey_pos4_bin.yml
    final_column: mart.m_train_race_horse_past5.jockey_pos4_bin5_relative_place_rate_3y_smooth_soft

scenarios:
  - scenario_name: baseline_existing
    validation_mode: baseline
    feature_set:
      base_feature_set_name: place_v1

  - scenario_name: add_jockey_pos4_bin_hard_smooth
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_pos4_bin5_place_rate_3y_smooth_hard]
      exclude_features: [jockey_pos4_bin5_place_rate_3y_smooth_soft, jockey_pos4_bin5_relative_place_rate_3y_smooth_soft]
    shap:
      candidate_feature: jockey_pos4_bin5_place_rate_3y_smooth_hard
      comparison_features: [jockey_style_place_rate_3y_smooth, jockey_avg_place_rate_smooth]
      report_run_label: jockey_pos4_bin_hard_smooth

  - scenario_name: replace_jockey_style_with_pos4_bin_hard_smooth
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_pos4_bin5_place_rate_3y_smooth_hard]
      exclude_features: [jockey_style_place_rate_3y_smooth]

  - scenario_name: add_jockey_pos4_bin_soft_smooth
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_pos4_bin5_place_rate_3y_smooth_soft]
      exclude_features: [jockey_pos4_bin5_place_rate_3y_smooth_hard, jockey_pos4_bin5_relative_place_rate_3y_smooth_soft]
    shap:
      candidate_feature: jockey_pos4_bin5_place_rate_3y_smooth_soft
      comparison_features: [jockey_pos4_bin5_place_rate_3y_smooth_hard, jockey_style_place_rate_3y_smooth]
      report_run_label: jockey_pos4_bin_soft_smooth

  - scenario_name: replace_jockey_style_with_pos4_bin_soft_smooth
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_pos4_bin5_place_rate_3y_smooth_soft]
      exclude_features: [jockey_style_place_rate_3y_smooth, jockey_pos4_bin5_place_rate_3y_smooth_hard]

  - scenario_name: add_jockey_pos4_bin_soft_relative
    validation_mode: single_add
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_pos4_bin5_relative_place_rate_3y_smooth_soft]
      exclude_features: [jockey_pos4_bin5_place_rate_3y_smooth_hard, jockey_pos4_bin5_place_rate_3y_smooth_soft]
    shap:
      candidate_feature: jockey_pos4_bin5_relative_place_rate_3y_smooth_soft
      comparison_features: [jockey_style_place_rate_3y_smooth, jockey_avg_place_rate_smooth]
      report_run_label: jockey_pos4_bin_soft_relative

  - scenario_name: add_jockey_pos4_bin_hard_and_soft
    validation_mode: feature_set_add
    feature_set:
      base_feature_set_name: place_v1
      include_features:
        - jockey_pos4_bin5_place_rate_3y_smooth_hard
        - jockey_pos4_bin5_place_rate_3y_smooth_soft
        - jockey_pos4_bin5_relative_place_rate_3y_smooth_soft

  - scenario_name: replace_jockey_style_with_pos4_bin_soft_relative
    validation_mode: replace_existing
    feature_set:
      base_feature_set_name: place_v1
      include_features: [jockey_pos4_bin5_relative_place_rate_3y_smooth_soft]
      exclude_features: [jockey_style_place_rate_3y_smooth]
